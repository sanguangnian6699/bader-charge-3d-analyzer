<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Bader Charge 3D Analyzer - Final v2</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; background: #ffffff; color: #333;}
        
        /* 鍙充晶鍘熸湁鐨勬暟鎹潰鏉?(娣辫壊绉戞妧鎰熼鏍? */
        #sidebar { width: 340px; background: #2d2d2d; color: #fff; padding: 20px; box-shadow: -2px 0 10px rgba(0,0,0,0.2); z-index: 10; overflow-y: auto; height: 100vh; box-sizing: border-box; }
        #canvas-container { flex-grow: 1; position: relative; background: #ffffff; }
        h2 { font-size: 1.1rem; margin-top: 0; border-bottom: 1px solid #555; padding-bottom: 8px; margin-bottom: 12px;}
        
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #ccc; }
        input[type="file"] { width: 100%; font-size: 0.8rem; margin-bottom: 5px; color: #fff; }
        input[type="number"] { width: 60px; padding: 3px; background: #444; border: 1px solid #555; color: #fff; border-radius: 3px; }
        .valence-row { display: flex; justify-content: space-between; margin-bottom: 5px; align-items: center; }
        
        button.btn-primary { width: 100%; padding: 10px; background: #007acc; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; transition: background 0.2s; }
        button.btn-primary:hover { background: #005a9e; }
        button.btn-secondary { width: 100%; padding: 8px; background: #555; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: background 0.2s; }
        button.btn-secondary:hover { background: #666; }
        button.btn-export { background: #e67e22; margin-top: 15px; }
        button.btn-export:hover { background: #d35400; }
        
        /* 鏂板锛氫笓闂ㄧ敤浜庨噸缃€変腑鐨勭孩鑹叉寜閽牱寮?*/
        button.btn-reset-sel { width: 100%; padding: 6px; background: #c9302c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; font-size: 0.8rem; transition: background 0.2s; }
        button.btn-reset-sel:hover { background: #ac2925; }

        #result-panel { margin-top: 15px; padding: 15px; background: #333; border-radius: 5px; border-left: 4px solid #007acc; }
        .result-item { margin-bottom: 10px; font-size: 0.95rem; }

        #selection-box { position: absolute; border: 1px solid rgba(0, 122, 204, 0.8); background: rgba(0, 122, 204, 0.2); pointer-events: none; display: none; z-index: 100; }
        .tip { font-size: 0.75rem; color: #888; margin-top: 5px; line-height: 1.4; }

        /* 宸︿晶鐨勮鍥炬帶鍒堕潰鏉?*/
        #left-panel { position: absolute; top: 20px; left: 20px; z-index: 10; width: 220px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; border: 1px solid #e2e8f0; color: #1e293b;}
        #left-panel h3 { margin: 0 0 15px 0; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #1e293b; padding-bottom: 10px; font-weight: 900;}
        .panel-section { margin-bottom: 20px; }
        .panel-section > label.title { display: block; font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 8px; }
        .btn-group { display: flex; gap: 6px; }
        .btn-view { flex: 1; padding: 6px 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-weight: 600; color: #0f172a; transition: all 0.2s;}
        .btn-view:hover { background: #f8fafc; border-color: #94a3b8; }
        .panel-box { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
        .radio-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; margin-bottom: 8px; color: #0f172a; font-weight: 500;}
        .radio-label:last-child { margin-bottom: 0; }
        .radio-label input[type="radio"] { accent-color: #0f172a; cursor: pointer; }

        /* 鍙充晶鏂板鎺т欢鏍峰紡 */
        .flex-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px;}
        .flex-row label { margin-bottom: 0; }
        input[type="range"] { width: 100%; margin-top: 5px; accent-color: #007acc; }
        select { width: 100%; padding: 5px; background: #444; color: #fff; border: 1px solid #555; border-radius: 3px; outline: none; }
        
        /* 鍏夌収闈㈡澘鏍峰紡 */
        .light-panel { display: flex; align-items: center; gap: 12px; background: #3a3a3a; padding: 12px; border-radius: 6px; border: 1px solid #555; margin-top: 5px; }
        .light-widget { position: relative; width: 68px; height: 68px; border-radius: 4px; border: 1px solid #111; cursor: crosshair; flex-shrink: 0; background-color: #5555ff; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
        .light-sliders { flex: 1; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="left-panel">
    <h3>馃敡 Tools</h3>
    
    <div class="panel-section">
        <label class="title">View Direction</label>
        <div class="btn-group">
            <button class="btn-view" id="btn-view-x">X</button>

        <label class="radio-label"><input type="radio" name="ori-mode" value="x"> Around X axis</label>

    </div>
</div>

<div id="canvas-container">
    <div id="selection-box"></div>
</div>

<div id="sidebar">
    <h2>1. 瀵煎叆鏁版嵁</h2>
    <div class="control-group">
        <label>涓婁紶 POSCAR</label>
        <input type="file" id="poscar-file" accept=".vasp, POSCAR, .txt">
    </div>
    <div class="control-group">
        <label>涓婁紶 ACF.dat</label>
        <input type="file" id="acf-file" accept=".dat, .txt">
    </div>

    <h2>2. POTCAR 浠风數瀛愭暟</h2>
    <div class="tip" style="color:#00fa9a; margin-bottom:8px;">鈽?宸茶嚜鍔ㄥ～鍏?VASP PBE 鏍囧噯浠风數瀛愭暟锛?br>鑻ヤ娇鐢ㄤ簡鐗规畩璧濆娍 (濡?_sv) 璇锋墜鍔ㄦ牎瀵广€?/div>
    <div id="valence-inputs">
        <div class="tip" style="color:#aaa;">璇峰厛涓婁紶 POSCAR 瑙ｆ瀽鍏冪礌</div>
    </div>
    <button class="btn-primary" id="render-btn">鐢熸垚 3D 瑙嗗浘涓庣儹鍔涘浘</button>

    <h2 style="margin-top: 20px;">3. 鍏夌収涓庤瑙掓帶鍒?/h2>
    <div class="control-group">
        <label>鍏夌収鏂瑰悜涓庡己搴﹁缃?/label>
        <div class="light-panel">
            <div class="light-widget" title="鎸変綇鎷栧姩浠ヨ皟鏁村厜鐓ф柟鍚?>
                <canvas id="light-canvas" width="64" height="64" style="display: block;"></canvas>
            </div>
            <div class="light-sliders">
                <div class="flex-row">
                    <label style="font-size: 0.75rem;">涓诲厜婧?/label>
                    <span id="val-light-intensity" style="font-size: 0.75rem;">1.0</span>
                </div>
                <input type="range" id="light-intensity" min="0.0" max="3.0" step="0.1" value="1.0" style="margin-bottom: 8px;">
                
                <div class="flex-row">
                    <label style="font-size: 0.75rem;">鐜搴曞厜</label>
                    <span id="val-ambient-intensity" style="font-size: 0.75rem;">0.8</span>
                </div>
                <input type="range" id="ambient-intensity" min="0.0" max="2.0" step="0.1" value="0.8">
            </div>
        </div>
    </div>
    <button class="btn-secondary" id="btn-reset-cam">馃攧 閲嶇疆妯″瀷瑙嗚涓庝綅缃?/button>

    <h2 style="margin-top: 20px;">4. 娓叉煋涓庡鍑鸿缃?/h2>
    <div class="control-group">
        <div class="flex-row">
            <label>鍘熷瓙鏄剧ず鍗婂緞:</label>
            <span id="val-radius" style="font-size:0.8rem; font-weight:bold;">0.50</span>
        </div>
        <input type="range" id="atom-radius" min="0.1" max="1.5" step="0.05" value="0.5">
    </div>
    <div class="control-group flex-row">
        <label>鑳屾櫙棰滆壊:</label>
        <input type="color" id="bg-color" value="#ffffff" style="width: 30px; height: 30px; padding: 0; border:none; cursor:pointer;">
    </div>
    <div class="control-group flex-row">
        <label>閫忔槑鑳屾櫙瀵煎嚭:</label>
        <input type="checkbox" id="bg-transparent" style="width: 18px; height: 18px; cursor:pointer;">
    </div>
    <div class="control-group">
        <label>瀵煎嚭娓呮櫚搴﹀€嶇巼:</label>
        <select id="export-scale">
            <option value="1">1x (灞忓箷鍒嗚鲸鐜?</option>
            <option value="2" selected>2x (楂樻竻鐢ㄤ簬灞曠ず)</option>
            <option value="4">4x (瓒呮竻鐢ㄤ簬璁烘枃鎵撳嵃)</option>
        </select>
    </div>
    <button class="btn-primary btn-export" id="btn-export">馃摳 瀵煎嚭楂樻竻 PNG</button>

    <h2 style="margin-top: 20px;">5. 妗嗛€夊垎鏋愮粨鏋?/h2>
    <div class="tip" style="color:#f39c12; margin-bottom: 10px;">鈿?<b>鎿嶄綔:</b> 鍦ㄨ鍥句腑 <b>鎸変綇 Shift 閿?+ 榧犳爣鎷栨嫿</b> 妗嗛€夌壒瀹氬師瀛愮兢銆?/div>
    <div id="result-panel">
        <div class="result-item">閫変腑鍘熷瓙鏁? <br><span class="result-value" id="sel-count">0</span></div>
        <div class="result-item">鐢佃嵎杞Щ鎬诲拰 (螖q): <br><span class="result-value" id="sel-sum">0.0000</span> e</div>
        <button class="btn-reset-sel" id="btn-reset-selection">鉂?閲嶇疆褰撳墠閫変腑</button>
        <div class="tip" style="margin-top:10px;">* 姝ｅ€?鍋忚摑)琛ㄧず澶卞幓鐢靛瓙<br>* 璐熷€?鍋忕孩)琛ㄧず寰楀埌鐢靛瓙</div>
    </div>
</div>

<script>
    let poscarData = { elements: [], counts: [], totalAtoms: 0 };
    let acfData = [];
    let atomsData = [];
    
    // Three.js 鍏ㄥ眬鍙橀噺
    let scene, camera, renderer, controls;
    let atomsGroup = new THREE.Group(); 
    let atomMeshes = [];
    
    // 鍏夌収鍏ㄥ眬鍙橀噺
    let ambientLight, dirLight;
    let lightVector = new THREE.Vector3(10, 15, 15).normalize();

    // 浜や簰鐘舵€佸彉閲?
    let isSelecting = false;
    let startX, startY;
    let currentOriMode = 'free'; 
    let dragLastPos = new THREE.Vector2();

    const selectionBox = document.getElementById('selection-box');
    const canvasContainer = document.getElementById('canvas-container');

    // ================= 鍐呯疆 VASP PBE 榛樿 ZVAL 鏁版嵁搴?=================
    // 鏁版嵁鏉ユ簮浜?VASP 瀹樻柟鎺ㄨ崘鐨勫父瑙?PAW_PBE 璧濆娍浠风數瀛愭暟
    const vasp_pbe_zval_db = {
        'H': 1, 'He': 2, 'Li': 1, 'Be': 2, 'B': 3, 'C': 4, 'N': 5, 'O': 6, 'F': 7, 'Ne': 8,
        'Na': 1, 'Mg': 2, 'Al': 3, 'Si': 4, 'P': 5, 'S': 6, 'Cl': 7, 'Ar': 8,
        'K': 9, 'Ca': 10, 'Sc': 11, 'Ti': 4, 'V': 5, 'Cr': 6, 'Mn': 7, 'Fe': 8, 'Co': 9, 'Ni': 10, 'Cu': 11, 'Zn': 12,
        'Ga': 3, 'Ge': 4, 'As': 5, 'Se': 6, 'Br': 7, 'Kr': 8,
        'Rb': 9, 'Sr': 10, 'Y': 11, 'Zr': 4, 'Nb': 5, 'Mo': 6, 'Tc': 7, 'Ru': 8, 'Rh': 9, 'Pd': 10, 'Ag': 11, 'Cd': 12,
        'In': 3, 'Sn': 4, 'Sb': 5, 'Te': 6, 'I': 7, 'Xe': 8,
        'Cs': 9, 'Ba': 10, 'La': 11, 'Ce': 12, 'Hf': 4, 'Ta': 5, 'W': 6, 'Re': 7, 'Os': 8, 'Ir': 9, 'Pt': 10, 'Au': 11, 'Hg': 12,
        'Tl': 13, 'Pb': 14, 'Bi': 15, 'Po': 6, 'At': 7, 'Rn': 8
    };

    // ================= 鍏夌収 Widget 缁樺埗閫昏緫 =================
    function updateLightWidget() {
        const canvas = document.getElementById('light-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width; const h = canvas.height;
        const r = w / 2 - 4; const cx = w / 2; const cy = h / 2;
        ctx.clearRect(0, 0, w, h);
        
        // 缁樺埗鐞冧綋娓愬彉
        const gx = cx + lightVector.x * r; const gy = cy - lightVector.y * r;
        const grad = ctx.createRadialGradient(gx, gy, 0, cx, cy, r);
        grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.3, '#aaaaaa'); grad.addColorStop(1, '#333333');
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#000'; ctx.stroke();
        
        // 缁樺埗鎸囩ず閽?
        const pinLength = 8;
        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + lightVector.x * pinLength, gy - lightVector.y * pinLength);
        ctx.lineWidth = 2.5; ctx.strokeStyle = '#222'; ctx.stroke();
        ctx.beginPath(); ctx.arc(gx + lightVector.x * pinLength, gy - lightVector.y * pinLength, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#000'; ctx.fill();
    }
    updateLightWidget();

    // ================= 1. UI 鍒濆鍖栦笌浜嬩欢缁戝畾 =================
    function initUIEvents() {
        // --- 瑙嗗浘鏂瑰悜蹇嵎閿?---
        document.getElementById('btn-view-x').addEventListener('click', () => setView('x'));
        document.getElementById('btn-view-y').addEventListener('click', () => setView('y'));
        document.getElementById('btn-view-z').addEventListener('click', () => setView('z'));

        // --- 閲嶇疆瑙嗚涓庝綅缃?---
        document.getElementById('btn-reset-cam').addEventListener('click', () => {
            if (!camera || !controls || !atomsGroup) return;
            // 娑堥櫎绾︽潫鎷栨嫿绱Н鐨勬棆杞?
            atomsGroup.quaternion.identity();
            // 閲嶇疆鐩告満浣嶇疆涓庢湞鍚?
            camera.position.set(0, 0, 30);
            camera.up.set(0, 1, 0);
            camera.lookAt(0, 0, 0);
            // 閲嶇疆杞ㄩ亾鎺у埗鍣ㄧ殑涓績鐐?
            controls.target.set(0, 0, 0);
            controls.update();
        });
        
        // --- 鏂板锛氶噸缃€変腑鍘熷瓙 ---
        document.getElementById('btn-reset-selection').addEventListener('click', () => {
            resetSelection();
        });

        // --- 鏃嬭浆涓庣害鏉熸ā寮?---
        document.querySelectorAll('input[name="rot-mode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (controls) controls.autoRotate = (e.target.value === 'anim');
            });
        });

        document.querySelectorAll('input[name="ori-mode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentOriMode = e.target.value;
                if (controls) controls.enableRotate = (currentOriMode === 'free');
            });
        });

        // --- 鍏夌収鎷栨嫿浜や簰 ---
        const lightCanvas = document.getElementById('light-canvas');
        const handleLightDrag = (e) => {
            if (e.buttons !== 1) return;
            const rect = lightCanvas.getBoundingClientRect();
            const cx = lightCanvas.width / 2; const cy = lightCanvas.height / 2; const r = lightCanvas.width / 2 - 4;
            let mx = e.clientX - rect.left - cx; let my = e.clientY - rect.top - cy;
            let dist = Math.sqrt(mx * mx + my * my);
            if (dist > r) { mx = (mx / dist) * r; my = (my / dist) * r; }
            const z = Math.sqrt(Math.max(0, r * r - mx * mx - my * my));
            lightVector.set(mx / r, -my / r, z / r).normalize();
            
            if (dirLight) {
                dirLight.position.copy(lightVector).multiplyScalar(50);
            }
            updateLightWidget();
        };
        lightCanvas.addEventListener('mousedown', handleLightDrag);
        lightCanvas.addEventListener('mousemove', handleLightDrag);

        // --- 鍏夌収寮哄害婊戝潡 ---
        document.getElementById('light-intensity').addEventListener('input', (e) => {
            document.getElementById('val-light-intensity').innerText = e.target.value;
            if (dirLight) dirLight.intensity = parseFloat(e.target.value);
        });
        document.getElementById('ambient-intensity').addEventListener('input', (e) => {
            document.getElementById('val-ambient-intensity').innerText = e.target.value;
            if (ambientLight) ambientLight.intensity = parseFloat(e.target.value);
        });

        // --- 鍗婂緞涓庤儗鏅缃?---
        document.getElementById('atom-radius').addEventListener('input', (e) => {
            const r = parseFloat(e.target.value);
            document.getElementById('val-radius').innerText = r.toFixed(2);
            atomMeshes.forEach(mesh => mesh.scale.setScalar(r / 0.5));
        });

        document.getElementById('bg-color').addEventListener('input', (e) => {
            if (scene && !document.getElementById('bg-transparent').checked) {
                scene.background = new THREE.Color(e.target.value);
            }
        });

        document.getElementById('bg-transparent').addEventListener('change', (e) => {
            if (!scene || !renderer) return;
            if (e.target.checked) {
                scene.background = null;
                renderer.setClearColor(0x000000, 0);
            } else {
                scene.background = new THREE.Color(document.getElementById('bg-color').value);
                renderer.setClearColor(0x000000, 1);
            }
        });

        // --- 瀵煎嚭鍔熻兘 ---
        document.getElementById('btn-export').addEventListener('click', () => {
            if (!renderer) return alert("璇峰厛鐢熸垚 3D 瑙嗗浘锛?);
            
            const scale = parseInt(document.getElementById('export-scale').value);
            const width = canvasContainer.clientWidth * scale;
            const height = canvasContainer.clientHeight * scale;
            
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            if (document.getElementById('bg-transparent').checked) {
                scene.background = null;
                renderer.setClearColor(0x000000, 0);
            } else {
                scene.background = new THREE.Color(document.getElementById('bg-color').value);
                renderer.setClearColor(0x000000, 1);
            }

            renderer.render(scene, camera);
            
            const link = document.createElement('a');
            link.download = 'Bader_Charge_3D.png';
            link.href = renderer.domElement.toDataURL('image/png', 1.0);
            link.click();

            renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
            camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.render(scene, camera);
        });
    }
    initUIEvents();

    // ================= 2. 鏁版嵁瑙ｆ瀽涓庡鐞?=================
    document.getElementById('poscar-file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length > 6) {
                const elements = lines[5].split(/\s+/);
                const counts = lines[6].split(/\s+/).map(Number);
                if (!isNaN(parseInt(elements[0]))) return alert("璇蜂娇鐢ㄥ甫鏈夊厓绱犵鍙疯(绗?琛?鐨?VASP 5 鏍煎紡 POSCAR锛?);

                poscarData.elements = elements;
                poscarData.counts = counts;
                poscarData.totalAtoms = counts.reduce((a, b) => a + b, 0);

                const valenceContainer = document.getElementById('valence-inputs');
                valenceContainer.innerHTML = '';
                
                // 鑷姩鍖归厤榛樿浠风數瀛愭暟骞剁敓鎴愯緭鍏ユ
                elements.forEach((el, index) => {
                    // 鏍囧噯鍖栧厓绱犵鍙?(濡?cu -> Cu)
                    let cleanEl = el.trim();
                    cleanEl = cleanEl.charAt(0).toUpperCase() + cleanEl.slice(1).toLowerCase();
                    
                    // 鑾峰彇榛樿鍊硷紝鎵句笉鍒板垯璁句负 0
                    const defaultVal = vasp_pbe_zval_db[cleanEl] !== undefined ? vasp_pbe_zval_db[cleanEl] : 0;

                    valenceContainer.innerHTML += `
                        <div class="valence-row">
                            <label>${cleanEl} 鍘熷瓙 (鍏?${counts[index]} 涓?:</label>
                            <input type="number" id="val-${el}" value="${defaultVal}" step="1" title="VASP PBE 榛樿浠风數瀛愭暟锛岃鏍规嵁瀹為檯浣跨敤鐨?POTCAR 鏍稿">
                        </div>`;
                });
            }
        };
        reader.readAsText(file);
    });

    document.getElementById('acf-file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split('\n');
            acfData = [];
            let startParsing = false;
            for (let line of lines) {
                line = line.trim();
                if (line.includes('----')) { startParsing = !startParsing; continue; }
                if (startParsing && line && !line.includes('VACUUM') && !line.includes('NUMBER')) {
                    const parts = line.split(/\s+/);
                    if (parts.length >= 5) acfData.push({ x: parseFloat(parts[1]), y: parseFloat(parts[2]), z: parseFloat(parts[3]), charge: parseFloat(parts[4]) });
                }
            }
        };
        reader.readAsText(file);
    });

    document.getElementById('render-btn').addEventListener('click', () => {
        if (poscarData.totalAtoms === 0 || acfData.length === 0) return alert("璇风‘淇濆凡涓婁紶 POSCAR 鍜?ACF.dat 鏂囦欢锛?);
        if (poscarData.totalAtoms !== acfData.length) return alert(`鍘熷瓙鏁伴噺涓嶅尮閰嶏紒POSCAR: ${poscarData.totalAtoms}, ACF: ${acfData.length}`);

        atomsData = [];
        let atomIndex = 0;
        
        for (let i = 0; i < poscarData.elements.length; i++) {
            const el = poscarData.elements[i];
            const count = poscarData.counts[i];
            const valence = parseFloat(document.getElementById(`val-${el}`).value);

            for (let j = 0; j < count; j++) {
                const acf = acfData[atomIndex];
                atomsData.push({
                    id: atomIndex, element: el,
                    x: acf.x, y: acf.y, z: acf.z,
                    deltaQ: valence - acf.charge 
                });
                atomIndex++;
            }
        }
        initThreeJS();
        resetSelection(); // 鐢熸垚鏂板浘鏃讹紝閲嶇疆鏃х殑閫変腑鐘舵€佹暟鎹?
    });

    // ================= 3. Three.js 鏍稿績娓叉煋 =================
    function initThreeJS() {
        if (scene) canvasContainer.innerHTML = '<div id="selection-box"></div>';

        scene = new THREE.Scene();
        if (!document.getElementById('bg-transparent').checked) {
            scene.background = new THREE.Color(document.getElementById('bg-color').value);
        }

        const width = canvasContainer.clientWidth;
        const height = canvasContainer.clientHeight;

        camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setSize(width, height);
        canvasContainer.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotateSpeed = 2.0;

        controls.autoRotate = document.querySelector('input[name="rot-mode"]:checked').value === 'anim';
        controls.enableRotate = currentOriMode === 'free';

        // --- 搴旂敤UI鐣岄潰鐨勫厜鐓ц缃?---
        ambientLight = new THREE.AmbientLight(0xffffff, parseFloat(document.getElementById('ambient-intensity').value));
        scene.add(ambientLight);

        dirLight = new THREE.DirectionalLight(0xffffff, parseFloat(document.getElementById('light-intensity').value));
        dirLight.position.copy(lightVector).multiplyScalar(50);
        scene.add(dirLight);

        atomsGroup = new THREE.Group();
        scene.add(atomsGroup);
        atomMeshes = [];

        let centerX = 0, centerY = 0, centerZ = 0;
        let maxAbsDeltaQ = 0.001;

        atomsData.forEach(atom => {
            centerX += atom.x; centerY += atom.y; centerZ += atom.z;
            if (Math.abs(atom.deltaQ) > maxAbsDeltaQ) maxAbsDeltaQ = Math.abs(atom.deltaQ);
        });
        
        centerX /= atomsData.length; centerY /= atomsData.length; centerZ /= atomsData.length;

        const geometry = new THREE.SphereGeometry(0.5, 32, 32); 
        const userRadiusRatio = parseFloat(document.getElementById('atom-radius').value) / 0.5;

        atomsData.forEach(atom => {
            let color = new THREE.Color(0xffffff);
            const ratio = atom.deltaQ / maxAbsDeltaQ; 
            
            if (ratio > 0) color.lerp(new THREE.Color(0x0055ff), ratio); 
            else color.lerp(new THREE.Color(0xff0055), -ratio);          

            // 浣跨敤 Phong 鏉愯川浠ュ畬缇庡弽棣堝厜鐓?
            const material = new THREE.MeshPhongMaterial({ color: color, shininess: 80 });
            const sphere = new THREE.Mesh(geometry, material);
            
            sphere.position.set(atom.x - centerX, atom.y - centerY, atom.z - centerZ);
            sphere.scale.setScalar(userRadiusRatio);
            sphere.userData = atom;
            
            atomsGroup.add(sphere);
            atomMeshes.push(sphere);
        });

        camera.position.set(0, 0, 30);
        controls.update();

        animate();
        setupSelectionAndDrag();
    }

    function animate() {
        requestAnimationFrame(animate);
        if (controls) controls.update(); 
        renderer.render(scene, camera);
    }

    // ================= 4. 瑙嗗浘鎺у埗涓庝簨浠舵帴绠?=================
    function setView(axis) {
        if (!camera || !controls || !atomsGroup) return;
        atomsGroup.quaternion.identity(); 
        
        const dist = camera.position.length() || 30; 
        if (axis === 'x') {
            camera.position.set(dist, 0, 0);
            camera.up.set(0, 1, 0);
        } else if (axis === 'y') {
            camera.position.set(0, dist, 0);
            camera.up.set(0, 0, -1); 
        } else if (axis === 'z') {
            camera.position.set(0, 0, dist);
            camera.up.set(0, 1, 0);
        }
        camera.lookAt(0, 0, 0);
        controls.target.set(0, 0, 0);
        controls.update();
    }

    // Shift 妗嗛€夐€昏緫 + X/Y/Z 绾︽潫鎷栨嫿閫昏緫
    function setupSelectionAndDrag() {
        const dom = renderer.domElement;

        window.addEventListener('keydown', (e) => {
            if ((e.key === 'Shift' || e.shiftKey)) {
                dom.style.cursor = 'crosshair';
                if (controls) controls.enabled = false;
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'Shift' || !e.shiftKey) {
                dom.style.cursor = 'default';
                if (controls && !isSelecting) controls.enabled = true;
            }
        });

        dom.addEventListener('pointerdown', (e) => {
            const rect = canvasContainer.getBoundingClientRect();
            
            if (e.shiftKey) {
                isSelecting = true;
                controls.enabled = false;
                startX = e.clientX - rect.left;
                startY = e.clientY - rect.top;
                
                selectionBox.style.display = 'block';
                selectionBox.style.left = startX + 'px';
                selectionBox.style.top = startY + 'px';
                selectionBox.style.width = '0px';
                selectionBox.style.height = '0px';
                e.stopPropagation();
            } else if (currentOriMode !== 'free') {
                dragLastPos.set(e.clientX, e.clientY);
                e.stopPropagation();
            }
        }, true);

        dom.addEventListener('pointermove', (e) => {
            if (isSelecting) {
                const rect = canvasContainer.getBoundingClientRect();
                const currentX = e.clientX - rect.left;
                const currentY = e.clientY - rect.top;

                selectionBox.style.left = Math.min(startX, currentX) + 'px';
                selectionBox.style.top = Math.min(startY, currentY) + 'px';
                selectionBox.style.width = Math.abs(currentX - startX) + 'px';
                selectionBox.style.height = Math.abs(currentY - startY) + 'px';
                e.stopPropagation();
                
            } else if (currentOriMode !== 'free' && e.buttons === 1) {
                const deltaX = e.clientX - dragLastPos.x;
                const deltaY = e.clientY - dragLastPos.y;
                
                const camX = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
                const camY = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
                const camZ = new THREE.Vector3(0, 0, 1).applyQuaternion(camera.quaternion).normalize();

                let angle = 0; let axis = new THREE.Vector3();

                if (currentOriMode === 'x') {
                    angle = deltaY * 0.01; axis.copy(camX);
                } else if (currentOriMode === 'y') {
                    angle = deltaX * 0.01; axis.copy(camY);
                } else if (currentOriMode === 'z') {
                    const rect = canvasContainer.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    const angle1 = Math.atan2(dragLastPos.y - cy, dragLastPos.x - cx);
                    const angle2 = Math.atan2(e.clientY - cy, e.clientX - cx);
                    let diff = angle2 - angle1;
                    if (diff > Math.PI) diff -= Math.PI * 2;
                    if (diff < -Math.PI) diff += Math.PI * 2;
                    angle = -diff; axis.copy(camZ);
                }

                dragLastPos.set(e.clientX, e.clientY);
                const q = new THREE.Quaternion().setFromAxisAngle(axis, angle);
                atomsGroup.quaternion.premultiply(q); 
                e.stopPropagation();
            }
        }, true);

        window.addEventListener('pointerup', (e) => {
            if (isSelecting) {
                isSelecting = false;
                selectionBox.style.display = 'none';

                const rect = canvasContainer.getBoundingClientRect();
                calculateSelection(
                    Math.min(startX, e.clientX - rect.left), Math.max(startX, e.clientX - rect.left),
                    Math.min(startY, e.clientY - rect.top), Math.max(startY, e.clientY - rect.top),
                    rect.width, rect.height
                );
                
                if (!e.shiftKey && controls) {
                    controls.enabled = true;
                    dom.style.cursor = 'default';
                }
            } else {
                if (controls && !e.shiftKey) controls.enabled = true;
            }
        }, true);
    }

    // ================= 5. 璁＄畻妗嗛€夌粨鏋滀笌閲嶇疆閫昏緫 =================
    // 閲嶇疆閫変腑鐘舵€佺殑涓撶敤鍑芥暟
    function resetSelection() {
        if (!atomMeshes || atomMeshes.length === 0) return;

        // 鎭㈠鎵€鏈夊師瀛愮殑瀹屽叏鏄剧ず鐘舵€?
        atomMeshes.forEach(mesh => {
            mesh.material.transparent = false;
            mesh.material.opacity = 1;
        });

        // 閲嶇疆 UI 鏁版嵁鏄剧ず
        document.getElementById('sel-count').innerText = 0;
        document.getElementById('sel-sum').innerText = "0.0000";
    }

    function calculateSelection(minX, maxX, minY, maxY, width, height) {
        let selectedCount = 0;
        let sumDeltaQ = 0;

        atomMeshes.forEach(mesh => {
            mesh.material.transparent = false;
            mesh.material.opacity = 1;

            const vector = new THREE.Vector3();
            vector.setFromMatrixPosition(mesh.matrixWorld);
            vector.project(camera);

            const screenX = (vector.x * 0.5 + 0.5) * width;
            const screenY = (vector.y * -0.5 + 0.5) * height;

            if (screenX >= minX && screenX <= maxX && screenY >= minY && screenY <= maxY) {
                selectedCount++;
                sumDeltaQ += mesh.userData.deltaQ;
            } else {
                mesh.material.transparent = true;
                mesh.material.opacity = 0.15; 
            }
        });

        if (selectedCount === 0) {
            atomMeshes.forEach(mesh => {
                mesh.material.transparent = false;
                mesh.material.opacity = 1;
            });
        }

        document.getElementById('sel-count').innerText = selectedCount;
        document.getElementById('sel-sum').innerText = sumDeltaQ.toFixed(4);
    }

    window.addEventListener('resize', () => {
        if (camera && renderer) {
            camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
        }
    });
</script>
